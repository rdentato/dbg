statement: dbgtrk is a variadic macro that accepts trace patterns as separate arguments and emits the stringized argument list in the TRK marker. Call sites should use dbgtrk("pattern1", "pattern2") rather than adjacent string literals with separators.
trigger: User manually changed dbg.h so dbgtrk uses variadic arguments and requested dependent files be updated.
